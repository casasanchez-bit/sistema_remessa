<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Casa Sanchez</title>
  <style>
    :root { --terracota: #C4574E; --laranja: #AF4005; --linen: #F9E9DC; --marrom: #5C442C; }
    * { box-sizing: border-box; }
    body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: var(--linen); color: var(--marrom); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #fff; border: 1px solid #e7d7c4; border-radius: 10px; padding: 28px; width: 320px; max-width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 16px; margin: 0 0 4px; color: var(--marrom); text-align: center; }
    p.sub { font-size: 12px; text-align: center; opacity: 0.7; margin: 0 0 18px; }
    label { font-size: 11.5px; color: var(--marrom); opacity: 0.75; display: block; margin-bottom: 3px; font-weight: 600; }
    input { padding: 9px 10px; border: 1px solid #d9c6b3; border-radius: 6px; font-size: 13px; width: 100%; margin-bottom: 12px; }
    .btn { background: var(--laranja); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; }
    .btn:hover { background: var(--terracota); }
    .flash { padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 14px; }
    .flash.erro { background: #f3d9d6; color: var(--terracota); border: 1px solid var(--terracota); }
    .flash.sucesso { background: #e3e8d8; color: #4d6b3a; border: 1px solid #4d6b3a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Casa Sanchez</h1>
    <p class="sub">Controle de Remessa &amp; Retorno</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for categoria, msg in messages %}
        <div class="flash {{ categoria }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="proximo" value="{{ proximo }}">
      <label>Usuário</label>
      <input type="text" name="usuario" autofocus required>
      <label>Senha</label>
      <input type="password" name="senha" required>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
