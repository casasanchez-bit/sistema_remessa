<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Casa Sanchez">
  <meta name="theme-color" content="#AF4005">
  <title>{% block title %}Casa Sanchez{% endblock %}</title>
  <style>
    :root { --terracota:#C4574E; --laranja:#AF4005; --linen:#F9E9DC; --marrom:#5C442C; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Segoe UI,Arial,sans-serif; background:#f4f0ec; color:var(--marrom); font-size:15px; }

    header { background:var(--laranja); color:#fff; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.25); }
    header .titulo { font-size:16px; font-weight:700; }
    header form button { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); color:#fff; padding:7px 14px; border-radius:7px; font-size:13px; cursor:pointer; }

    main { padding:12px; max-width:560px; margin:0 auto; }

    .card { background:#fff; border-radius:10px; box-shadow:0 1px 5px rgba(0,0,0,.1); margin-bottom:14px; overflow:hidden; }
    .card-header { background:var(--linen); padding:11px 14px; font-weight:700; font-size:14px; border-bottom:1px solid #e7d7c4; }

    a.row-item, div.row-item { display:flex; align-items:center; padding:13px 14px; border-bottom:1px solid #f0ece8; min-height:52px; text-decoration:none; color:var(--marrom); }
    a.row-item:last-child, div.row-item:last-child { border-bottom:none; }
    a.row-item:active { background:#fdf6f0; }
    .row-name { flex:1; font-size:14px; line-height:1.35; }
    .row-badge { background:var(--linen); color:var(--laranja); font-weight:700; font-size:14px; padding:4px 12px; border-radius:20px; white-space:nowrap; margin-left:10px; }

    .search-wrap { padding:10px 14px; border-bottom:1px solid #f0ece8; }
    .search-wrap input { width:100%; padding:9px 12px; border:1px solid #d9c6b3; border-radius:8px; font-size:14px; outline:none; }
    .search-wrap input:focus { border-color:var(--laranja); }

    .btn-voltar { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #d9c6b3; border-radius:8px; padding:9px 16px; font-size:14px; color:var(--marrom); text-decoration:none; margin-bottom:14px; cursor:pointer; }

    .empty { padding:20px 14px; color:#999; font-size:13px; text-align:center; }

    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; }
    .b-pendente { background:#fde8e8; color:#c4501a; }
    .b-parcial  { background:#fff3cd; color:#856404; }
    .b-concluida { background:#e3e8d8; color:#4d6b3a; }

    .remessa-card { border-bottom:2px solid #e7d7c4; }
    .remessa-card:last-child { border-bottom:none; }
    .remessa-titulo { background:var(--linen); padding:9px 14px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:space-between; }
    .remessa-obs { padding:7px 14px; background:#fdf6f0; font-size:12px; color:#666; font-style:italic; border-bottom:1px solid #f0ece8; white-space:pre-wrap; }
    .remessa-obs b { color:var(--marrom); font-style:normal; }
    .item-row { padding:10px 14px; border-bottom:1px solid #f0ece8; font-size:13px; }
    .item-row:last-child { border-bottom:none; }
    .item-produto { font-weight:600; margin-bottom:4px; }
    .item-meta { color:#888; font-size:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .item-destaque { background:#fffbea; border-left:4px solid var(--laranja); padding-left:10px; }
    .item-pend { font-weight:700; color:var(--marrom); }
  </style>
</head>
<body>
<header>
  <span class="titulo">Casa Sanchez</span>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Sair</button>
  </form>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
