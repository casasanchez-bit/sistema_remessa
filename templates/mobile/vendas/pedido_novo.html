{% extends "mobile/base.html" %}
{% block title %}Novo Pedido — Casa Sanchez{% endblock %}
{% block content %}

<button class="btn-voltar" onclick="location.href='/m/vendas/'">← Voltar</button>

<div class="card">
  <div class="card-header">Novo Pedido</div>
  <form method="post" style="padding:14px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div style="margin-bottom:14px;">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Data</label>
      <input type="date" name="data" value="{{ hoje }}"
             style="width:100%;padding:11px;border:1px solid #d9c6b3;border-radius:8px;font-size:15px;">
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Cliente *</label>
      <input type="search" id="busca-cliente" placeholder="Digite o nome ou código..."
             oninput="filtrarClientes()"
             style="width:100%;padding:11px;border:1px solid #d9c6b3;border-radius:8px;font-size:15px;margin-bottom:6px;">
      <select name="cliente_id" id="sel-cliente" required size="5"
              style="width:100%;border:1px solid #d9c6b3;border-radius:8px;font-size:14px;padding:4px;">
        {% for c in clientes %}
        <option value="{{ c.id }}" data-label="{{ c.codigo }} {{ c.nome }}">{{ c.codigo }} — {{ c.nome }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Representante / Guia</label>
      <select name="representante_id"
              style="width:100%;padding:11px;border:1px solid #d9c6b3;border-radius:8px;font-size:15px;">
        <option value="">— Nenhum —</option>
        {% for r in representantes %}
        <option value="{{ r.id }}">{{ r.nome }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Tabela de Preços</label>
      <select name="tabela_id"
              style="width:100%;padding:11px;border:1px solid #d9c6b3;border-radius:8px;font-size:15px;">
        <option value="">— Sem tabela —</option>
        {% for t in tabelas %}
        <option value="{{ t.id }}">{{ t.nome }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="margin-bottom:20px;">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Observação</label>
      <input type="text" name="observacao" placeholder="Opcional"
             style="width:100%;padding:11px;border:1px solid #d9c6b3;border-radius:8px;font-size:15px;">
    </div>

    <button type="submit"
            style="width:100%;background:#5C442C;color:#fff;border:none;border-radius:10px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;">
      Criar Pedido →
    </button>
  </form>
</div>

<script>
function filtrarClientes() {
  var t = document.getElementById('busca-cliente').value.toLowerCase();
  document.querySelectorAll('#sel-cliente option').forEach(function(op) {
    op.style.display = op.dataset.label.toLowerCase().includes(t) ? '' : 'none';
  });
}
</script>
{% endblock %}
