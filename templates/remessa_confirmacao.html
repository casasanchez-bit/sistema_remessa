{% extends "base.html" %}
{% block content %}
<div class="card" style="text-align:center;padding:30px;">
  <div style="font-size:40px;margin-bottom:8px;">✅</div>
  <h2 style="margin-bottom:6px;">Remessa Nº {{ remessa.numero }} registrada com sucesso!</h2>
  <p class="small">Terceirizado: {{ remessa.terceirizado_nome }} — Data do envio: {{ remessa.data_envio|brdate }}</p>
  <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
    <a class="btn" href="/remessas/{{ remessa.id }}/imprimir" target="_blank">Imprimir remessa</a>
    <a class="btn secondary" href="/remessas">Ir para o histórico de remessas</a>
  </div>
</div>
{% endblock %}
